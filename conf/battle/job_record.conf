//--------------------------------------------------------------
// rAthena Battle Configuration File
// [Job Record] Settings of the job record system.
// See docs/subsystems/map/job-record-system-design.md
//--------------------------------------------------------------
// Note 1: Value is a config switch (on/off, yes/no or 1/0)
// Note 2: Value is in percents (100 means 100%)
// Note 3: Value is a bit field. If no description is given,
//         assume unit types (1: Pc, 2: Mob, 4: Pet, 8: Homun, 16: Mercenary, 128: NPC, 512: Elemental)
//--------------------------------------------------------------

// Maximum number of job records per character, the active one included.
// 0 = unlimited
job_record_max: 20

// Time a player has to wait after creating, switching or deleting a record
// before doing it again (in milliseconds). It starts when the action has finished.
job_record_cooldown: 30000

// A player who attacked, used a skill or was hit within this time is considered
// in combat and can't create or switch records (in milliseconds).
// Which actions count follows prevent_logout_trigger (conf/battle/player.conf).
job_record_combat_delay: 10000
