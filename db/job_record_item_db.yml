###########################################################################
# [Job Record] Items of the job record system
###########################################################################
#
# Imported from db/item_db.yml. See doc/yaml/db/item_db.yml for the format.
#
# The client needs an entry for item 900000 too (name, description and
# sprite in its item info file), otherwise it shows as an unknown item.
#
###########################################################################

Header:
  Type: ITEM_DB
  Version: 3

Body:
  - Id: 900000
    AegisName: Job_Record_Book
    Name: Job Record Book
    Type: Usable
    Weight: 0
    Flags:
      NoConsume: true
    Trade:
      NoDrop: true
      NoTrade: true
      NoSell: true
      NoCart: true
      NoStorage: true
      NoGuildStorage: true
      NoMail: true
      NoAuction: true
    Script: |
      callfunc "F_JobRecord";
