###########################################################################
# [Job Record] Job-quest progress kept per record
###########################################################################
#
# Character variables and quest log entries listed here belong to a job
# record: they are saved with the record when the player switches away,
# cleared, and restored when the player switches back. A new record starts
# without them, so the official job quests can be done again.
#
# Everything not listed here stays shared by all records of the character.
# Engine variables (job change levels, Star Gladiator feel/hate, Taekwon
# mission) are always handled and don't need to be listed.
#
# Curated from the job scripts loaded by npc/scripts_jobs.conf and
# npc/re/scripts_jobs.conf (job quests, skill quests, Novice Academy).
# Left out on purpose because other content uses them too:
#   MISC_QUEST, RESRVPTS, sail, xmas_npc
#   quests 11769, 11782 (DeepForest instance), 14154-14157 (lasagna),
#   21001, 21008 (Izlude warps)
#
###########################################################################
# Entries (one key per entry)
###########################################################################
# - Variable           Permanent character variable name (all array indexes).
#                      String variables end with $.
# - Prefix             Every permanent character variable starting with this text.
# - Quest              Quest id.
#   To                 Last quest id of a range starting at Quest. (Optional)
###########################################################################

